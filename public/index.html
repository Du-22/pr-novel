<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6C5CE7" />
    <meta name="robots" content="index, follow" />

    <!-- Google Fonts: Noto Sans TC/SC (UI 黑體) + Noto Serif TC/SC (內文宋體) + Plus Jakarta Sans (英文 fallback)
         SC 為 fallback,只在 SC 字符出現時透過 unicode-range 機制自動下載對應 subset -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- 霞鶩文楷 Screen (LXGW WenKai Screen) — 楷體,用於書脊裝飾性場合 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css"
    />

    <!-- Dark mode 抗 FOUC: React render 之前先設定好 <html.dark> class,
         避免初始閃白。讀取順序: localStorage > prefers-color-scheme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pr-novel-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved !== "light" && prefersDark);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="PR小說網是提供原創小說閱讀、作品分享與讀者交流的繁體中文小說平台。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:site_name" content="PR小說網" />
    <meta property="og:title" content="PR小說網｜原創小說閱讀與創作平台" />
    <meta
      property="og:description"
      content="PR小說網是提供原創小說閱讀、作品分享與讀者交流的繁體中文小說平台。"
    />
    <meta property="og:url" content="https://pr-novel.vercel.app/" />
    <meta
      property="og:image"
      content="https://pr-novel.vercel.app/favicon-180x180.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PR小說網｜原創小說閱讀與創作平台" />
    <meta
      name="twitter:description"
      content="PR小說網是提供原創小說閱讀、作品分享與讀者交流的繁體中文小說平台。"
    />
    <meta
      name="twitter:image"
      content="https://pr-novel.vercel.app/favicon-180x180.png"
    />
    <script id="site-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://pr-novel.vercel.app/#website",

            "inLanguage": "zh-TW",

            }
          }
        ]
      }
    </script>

      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
